[project]
name = "rabbit-hole-research"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alibabacloud-alimt20181012==1.5.2",
  "aiosqlite>=0.21,<1", "alembic>=1.13,<2", "boto3>=1.35,<2", "fastapi>=0.115,<1",
  "httpx>=0.27,<1", "openai>=1.50,<3", "playwright>=1.48,<2",
  "prometheus-client>=0.21,<1", "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3", "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "mypy>=1.13,<2", "pytest>=8.3,<9", "pytest-asyncio>=0.24,<1",
  "respx>=0.21,<1", "ruff>=0.8,<1", "testcontainers>=4.9,<5",
  "pyyaml>=6,<7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = ["e2e: opt-in Phase 1 staging acceptance tests"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
