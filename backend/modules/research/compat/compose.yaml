name: rabbit-hole-phase1

x-application-environment: &application-environment
  env_file:
    - .env
  environment:
    RABBIT_HOLE_PROVIDER_SECRETS_PATH: /app/provider-secrets/keys.json
  volumes:
    - provider_secrets:/app/provider-secrets

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rabbit
      POSTGRES_USER: rabbit
      POSTGRES_PASSWORD: ${RABBIT_HOLE_POSTGRES_PASSWORD:?set_in_dotenv}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rabbit -d rabbit"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${RABBIT_HOLE_S3_ACCESS_KEY:?set_in_dotenv}
      MINIO_ROOT_PASSWORD: ${RABBIT_HOLE_S3_SECRET_KEY:?set_in_dotenv}
    command: server /data --console-address :9001
    volumes:
      - minio_data:/data
    networks: [backend]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${RABBIT_HOLE_S3_ACCESS_KEY:?set_in_dotenv}
      MINIO_ROOT_PASSWORD: ${RABBIT_HOLE_S3_SECRET_KEY:?set_in_dotenv}
      RABBIT_HOLE_S3_BUCKET: ${RABBIT_HOLE_S3_BUCKET:?set_in_dotenv}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done
        mc mb --ignore-existing "local/$${RABBIT_HOLE_S3_BUCKET}"
        mc version enable "local/$${RABBIT_HOLE_S3_BUCKET}"
        mc anonymous set none "local/$${RABBIT_HOLE_S3_BUCKET}"
    networks: [backend]

  api:
    <<: *application-environment
    build: .
    image: rabbit-hole-phase1:local
    restart: unless-stopped
    command: ["python", "-m", "rabbit_hole.runtime.server"]
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [backend, egress]

  workbench-worker:
    <<: *application-environment
    image: rabbit-hole-phase1:local
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["python", "-m", "rabbit_hole.runtime.workbench_worker"]
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "rabbit_hole.runtime.workbench_worker", "health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [backend, egress]

  worker:
    profiles: [legacy]
    <<: *application-environment
    image: rabbit-hole-phase1:local
    restart: unless-stopped
    command: ["python", "-m", "rabbit_hole.worker"]
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "rabbit_hole.runtime.server", "worker-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [backend, egress]

networks:
  backend:
    internal: true
  egress:

volumes:
  postgres_data:
  minio_data:
  provider_secrets:
